services:
  - type: web
    name: unfriends-realtime
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run typecheck --workspace @unfriends/realtime-server
    startCommand: npm run start --workspace @unfriends/realtime-server
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SOCKET_TICKET_SECRET
        generateValue: true
      - key: SOCKET_ALLOWED_ORIGINS
        sync: false
